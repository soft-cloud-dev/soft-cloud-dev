name: 'Setup Locked Python Environment'
description: 'Configures Python 3.12.14, creates .venv from requirements.lock, and registers the jb2-python kernel.'
runs:
  using: 'composite'
  steps:
    - name: Configure Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12.14'
        architecture: x64

    - name: Install locked environment
      shell: bash
      run: |
        python -c 'import sys; assert sys.implementation.name == "cpython" and sys.version_info[:3] == (3, 12, 14), sys.version'
        python -m venv .venv
        .venv/bin/python -m pip install \
          --require-hashes \
          --only-binary=:all: \
          -r requirements.lock
        .venv/bin/python -m pip check
        .venv/bin/python -m ipykernel install \
          --sys-prefix \
          --name jb2-python \
          --display-name 'Python (JB2)'
