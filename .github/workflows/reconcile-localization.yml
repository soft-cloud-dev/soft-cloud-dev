name: Reconcile Localization

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reconcile-localization-main
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      locales: ${{ steps.plan.outputs.locales }}
      count: ${{ steps.plan.outputs.count }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup locked Python environment
        uses: ./.github/actions/setup-python-env

      - name: Compute reconciliation plan
        id: plan
        run: |
          . .venv/bin/activate
          python tools/plan_localization.py --json --output plan.json
          python -c '
          import json, os
          with open("plan.json") as f:
              p = json.load(f)
          needed = p.get("locales_needing_work", [])
          print(f"Locales needing reconciliation: {needed}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"locales={json.dumps(needed)}\n")
              gh.write(f"count={len(needed)}\n")
          '

  reconcile:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      matrix:
        locale: ${{ fromJson(needs.plan.outputs.locales) }}
      max-parallel: 2
      fail-fast: false
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_generate-locale.yml
    with:
      locale: ${{ matrix.locale }}
    secrets: inherit
