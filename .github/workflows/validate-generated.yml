name: Validate Generated Localization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup locked Python environment
        uses: ./.github/actions/setup-python-env

      - name: Verify JB2 profile and provenance
        env:
          BASE_URL: ""
        run: |
          . .venv/bin/activate
          python tools/check_profile.py
          python tools/translate_sources.py --check-only

      - name: Verify localized narration audio checksums (API-free)
        run: |
          . .venv/bin/activate
          python tools/generate_audio.py --all-locales --narrated-only --check-only

      - name: Verify multilingual configuration and progressive publication
        run: |
          . .venv/bin/activate
          python tools/verify_locales.py --progressive

      - name: Run verification test suites
        run: |
          . .venv/bin/activate
          python -m unittest discover -s tests
