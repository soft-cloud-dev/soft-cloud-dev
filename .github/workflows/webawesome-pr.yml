name: Web Awesome SSR PR Verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webawesome-pr-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup locked Python environment
        uses: ./.github/actions/setup-python-env

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          npm ci
          node scripts/check-node-dependencies.mjs
          npx playwright install --with-deps chromium webkit

      - name: Run shared CI verification driver
        env:
          BASE_URL: ""
          HOME: ${{ runner.temp }}/ci-home
          JUPYTER_CONFIG_DIR: ${{ runner.temp }}/jupyter-config
          JUPYTER_RUNTIME_DIR: ${{ runner.temp }}/jupyter-runtime
          HOST: "127.0.0.1"
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          SOFTCLOUD_AUDIO_OFFLINE: '1'
        run: |
          mkdir -p "$HOME" "$JUPYTER_CONFIG_DIR" "$JUPYTER_RUNTIME_DIR"
          printf 'c.ServerApp.allow_root = True\n' > "$JUPYTER_CONFIG_DIR/jupyter_server_config.py"
          . .venv/bin/activate
          bash scripts/ci-test-driver.sh

      - name: Upload handbook viewport screenshots
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: executable-handbook-visuals
          path: test-results/**/handbook-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
