name: Web Awesome SSR PR Verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webawesome-pr-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup locked Python environment
        uses: ./.github/actions/setup-python-env

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install Node dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: |
          node --version
          npm ci
          node scripts/check-node-dependencies.mjs
          npx playwright --version
          test -d "${PLAYWRIGHT_BROWSERS_PATH}"

      - name: Run shared CI verification driver
        env:
          BASE_URL: ""
          SOFTCLOUD_AUDIO_OFFLINE: '1'
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: |
          . .venv/bin/activate
          bash scripts/ci-test-driver.sh

      - name: Upload handbook viewport screenshots
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: executable-handbook-visuals
          path: test-results/**/handbook-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
