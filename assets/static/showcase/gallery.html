<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>SoftCloud real-media gallery</title>
<style>
  :root{color-scheme:light dark;font:16px/1.45 system-ui,sans-serif}
  body{max-width:1024px;margin:0 auto;padding:20px}
  h1{font-size:1.5rem;margin:0 0 1rem}
  section{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}
  figure{margin:0;border:1px solid #aaa;border-radius:10px;overflow:hidden}
  img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
  figcaption{padding:0.65rem}
</style>
</head>
<body>
<h1>Bundled photographic media</h1>
<p>A script-free, same-origin gallery for the Web Awesome zoomable-frame demonstration.</p>
<section>
<figure><img src="./rocket.jpg" alt="Falcon 9 carrying DSCOVR launches" width="640" height="427"><figcaption>Falcon 9 rocket launch — public domain (SpaceX)</figcaption></figure>
<figure><img src="./coffee.png" alt="White coffee cup viewed from above" width="600" height="400"><figcaption>Coffee cup — CC0 (Rachel Michetti)</figcaption></figure>
<figure><img src="./hubble-deep-field.jpg" alt="Hubble eXtreme Deep Field containing galaxies" width="1000" height="872"><figcaption>Hubble eXtreme Deep Field — NASA public domain</figcaption></figure>
<figure><img src="./astronaut.png" alt="NASA portrait of astronaut Eileen Collins" width="512" height="512"><figcaption>Eileen Collins portrait — NASA public domain</figcaption></figure>
</section>
</body>
</html>
