<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Bubble Chart example</title><desc id="chart-desc">Three bubbles for Edge, API, and Batch; size indicates host count, horizontal axis throughput, vertical axis latency.</desc><rect x="0" y="0" width="640" height="340" fill="#fff"/><rect x="1" y="1" width="638" height="338" rx="8" fill="none" stroke="#cbd5e1"/><text x="28" y="37" font-family="sans-serif" font-size="14" fill="#172033" font-size="22" font-weight="700">Bubble Chart</text><line x1="95" y1="260" x2="545" y2="260" stroke="#475569"/><line x1="95" y1="260" x2="95" y2="75" stroke="#475569"/><circle cx="271.0" cy="138.6" r="14" fill="#1d4ed8" fill-opacity=".66" stroke="#172033" stroke-width="1"/><text x="271" y="116.57142857142856" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">Edge</text><circle cx="359.0" cy="156.8" r="18" fill="#0f766e" fill-opacity=".66" stroke="#172033" stroke-width="1"/><text x="359" y="130.78571428571428" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">API</text><circle cx="447.0" cy="126.4" r="24" fill="#b45309" fill-opacity=".66" stroke="#172033" stroke-width="1"/><text x="447" y="94.42857142857144" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">Batch</text><text x="350" y="305" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle">Throughput (req/s)</text><text x="15" y="170" font-family="sans-serif" font-size="14" fill="#172033" transform="rotate(-90 15 170)" text-anchor="middle">Latency (ms)</text></svg>
