<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Doughnut Chart example</title><desc id="chart-desc">Doughnut chart: Compute 50 percent, Storage 30 percent, Network 20 percent.</desc><rect x="0" y="0" width="640" height="340" fill="#fff"/><rect x="1" y="1" width="638" height="338" rx="8" fill="none" stroke="#cbd5e1"/><text x="28" y="37" font-family="sans-serif" font-size="14" fill="#172033" font-size="22" font-weight="700">Doughnut Chart</text><path d="M 245 177 L 245.00 67.00 A 110 110 0 0 1 245.01 287.00 Z" fill="#1d4ed8" stroke="#fff" stroke-width="2"/><rect x="420" y="112" width="15" height="15" fill="#1d4ed8"/><text x="443" y="125" font-family="sans-serif" font-size="14" fill="#172033" font-size="13">Compute: 50%</text><path d="M 245 177 L 245.00 287.00 A 110 110 0 0 1 140.38 143.02 Z" fill="#0f766e" stroke="#fff" stroke-width="2"/><rect x="420" y="149" width="15" height="15" fill="#0f766e"/><text x="443" y="162" font-family="sans-serif" font-size="14" fill="#172033" font-size="13">Storage: 30%</text><path d="M 245 177 L 140.38 143.01 A 110 110 0 0 1 244.99 67.00 Z" fill="#b45309" stroke="#fff" stroke-width="2"/><rect x="420" y="186" width="15" height="15" fill="#b45309"/><text x="443" y="199" font-family="sans-serif" font-size="14" fill="#172033" font-size="13">Network: 20%</text><circle cx="245" cy="177" r="54" fill="#fff"/><text x="245" y="182" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-weight="700">100%</text></svg>
