<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Line Chart example</title><desc id="chart-desc">Line increases from 42 to 57 requests then decreases to 51.</desc><rect x="0" y="0" width="640" height="340" fill="#fff"/><rect x="1" y="1" width="638" height="338" rx="8" fill="none" stroke="#cbd5e1"/><text x="28" y="37" font-family="sans-serif" font-size="14" fill="#172033" font-size="22" font-weight="700">Line Chart</text><line x1="90" y1="260" x2="540" y2="260" stroke="#475569" stroke-width="1.5"/><text x="165" y="285" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">Week 1</text><text x="165" y="131.38672768878718" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">42</text><text x="315" y="285" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">Week 2</text><text x="315" y="89.7391304347826" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">57</text><text x="465" y="285" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">Week 3</text><text x="465" y="106.39816933638443" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">51</text><polyline points="165.00,143.39 315.00,101.74 465.00,118.40" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="165.00" cy="143.39" r="4" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><circle cx="315.00" cy="101.74" r="4" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><circle cx="465.00" cy="118.40" r="4" fill="#fff" stroke="#1d4ed8" stroke-width="2"/></svg>
