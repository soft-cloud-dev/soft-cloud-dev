<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Polar Area Chart example</title><desc id="chart-desc">Four radial sectors show CPU 30, Disk 60, Network 45, and Memory 80 percent.</desc><rect x="0" y="0" width="640" height="340" fill="#fff"/><rect x="1" y="1" width="638" height="338" rx="8" fill="none" stroke="#cbd5e1"/><text x="28" y="37" font-family="sans-serif" font-size="14" fill="#172033" font-size="22" font-weight="700">Polar Area Chart</text><path d="M 245 177 L 245.00 113.20 A 63.8 63.8 0 0 1 308.80 176.99 Z" fill="#1d4ed8" stroke="#fff" stroke-width="2"/><rect x="420" y="112" width="15" height="15" fill="#1d4ed8"/><text x="443" y="125" font-family="sans-serif" font-size="14" fill="#172033" font-size="13">CPU: 30%</text><path d="M 245 177 L 334.60 177.00 A 89.6 89.6 0 0 1 245.01 266.60 Z" fill="#0f766e" stroke="#fff" stroke-width="2"/><rect x="420" y="149" width="15" height="15" fill="#0f766e"/><text x="443" y="162" font-family="sans-serif" font-size="14" fill="#172033" font-size="13">Disk: 60%</text><path d="M 245 177 L 245.00 253.70 A 76.7 76.7 0 0 1 168.30 177.01 Z" fill="#b45309" stroke="#fff" stroke-width="2"/><rect x="420" y="186" width="15" height="15" fill="#b45309"/><text x="443" y="199" font-family="sans-serif" font-size="14" fill="#172033" font-size="13">Network: 45%</text><path d="M 245 177 L 138.20 177.00 A 106.8 106.8 0 0 1 244.99 70.20 Z" fill="#7c3aed" stroke="#fff" stroke-width="2"/><rect x="420" y="223" width="15" height="15" fill="#7c3aed"/><text x="443" y="236" font-family="sans-serif" font-size="14" fill="#172033" font-size="13">Memory: 80%</text></svg>
