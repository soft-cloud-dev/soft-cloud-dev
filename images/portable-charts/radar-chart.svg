<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Radar Chart example</title><desc id="chart-desc">Radar polygon for availability 90, latency score 70, reliability 85, capacity 60.</desc><rect x="0" y="0" width="640" height="340" fill="#fff"/><rect x="1" y="1" width="638" height="338" rx="8" fill="none" stroke="#cbd5e1"/><text x="28" y="37" font-family="sans-serif" font-size="14" fill="#172033" font-size="22" font-weight="700">Radar Chart</text><polygon points="285.0,148.8 311.3,175.0 285.0,201.3 258.8,175.0" fill="none" stroke="#cbd5e1"/><polygon points="285.0,122.5 337.5,175.0 285.0,227.5 232.5,175.0" fill="none" stroke="#cbd5e1"/><polygon points="285.0,96.3 363.8,175.0 285.0,253.8 206.3,175.0" fill="none" stroke="#cbd5e1"/><polygon points="285.0,70.0 390.0,175.0 285.0,280.0 180.0,175.0" fill="none" stroke="#cbd5e1"/><line x1="285" y1="175" x2="285" y2="70" stroke="#94a3b8"/><text x="285" y="43" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">Availability</text><line x1="285" y1="175" x2="390" y2="175" stroke="#94a3b8"/><text x="423" y="175" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">Latency score</text><line x1="285" y1="175" x2="285" y2="280" stroke="#94a3b8"/><text x="285" y="307" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">Reliability</text><line x1="285" y1="175" x2="180" y2="175" stroke="#94a3b8"/><text x="147" y="175.00000000000003" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">Capacity</text><polygon points="285.00,80.50 358.50,175.00 285.00,264.25 222.00,175.00" fill="#1d4ed8" fill-opacity=".35" stroke="#1d4ed8" stroke-width="3"/></svg>
