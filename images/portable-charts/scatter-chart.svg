<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Scatter Chart example</title><desc id="chart-desc">Four points: A (1,2), B (2,3), C (3,2), D (4,5).</desc><rect x="0" y="0" width="640" height="340" fill="#fff"/><rect x="1" y="1" width="638" height="338" rx="8" fill="none" stroke="#cbd5e1"/><text x="28" y="37" font-family="sans-serif" font-size="14" fill="#172033" font-size="22" font-weight="700">Scatter Chart</text><line x1="95" y1="260" x2="545" y2="260" stroke="#475569"/><line x1="95" y1="260" x2="95" y2="75" stroke="#475569"/><circle cx="183.0" cy="203.3" r="7" fill="#1d4ed8" fill-opacity=".66" stroke="#172033" stroke-width="1"/><text x="183" y="188.33333333333334" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">A</text><circle cx="271.0" cy="175.0" r="7" fill="#0f766e" fill-opacity=".66" stroke="#172033" stroke-width="1"/><text x="271" y="160" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">B</text><circle cx="359.0" cy="203.3" r="7" fill="#b45309" fill-opacity=".66" stroke="#172033" stroke-width="1"/><text x="359" y="188.33333333333334" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">C</text><circle cx="447.0" cy="118.3" r="7" fill="#7c3aed" fill-opacity=".66" stroke="#172033" stroke-width="1"/><text x="447" y="103.33333333333331" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle" font-size="12">D</text><text x="350" y="305" font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle">X observations</text><text x="15" y="170" font-family="sans-serif" font-size="14" fill="#172033" transform="rotate(-90 15 170)" text-anchor="middle">Y observations</text></svg>
